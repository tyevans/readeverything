[project]
name = "deepagents-read-everything"
version = "0.1.0"
description = "Give an agent eyes into a filesystem: mimetype-dispatched media representations with locator-carrying provenance."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ty Evans", email = "tyler@poorlythoughtout.com" }]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.12,<3",
    "puremagic>=1.28",
    "charset-normalizer>=3.4",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
vision = ["langchain-openai>=0.2", "langchain-core>=0.3"]
images = ["pillow>=11.0"]
documents = ["pypdfium2>=5.13,<6"]
transcription = ["faster-whisper>=1.2,<2"]
# Transcription against a whisper.cpp server instead of local weights: an HTTP
# client and nothing else, so it is a far lighter extra than `transcription`.
remote-transcription = ["httpx>=0.27"]
testing = ["pytest>=8.3"]
# Pinned below 0.8: deepagents' surface moves fast, and an unpinned dependency
# on a fast-moving 0.x is how a library acquires breakage it did not choose.
agents = ["deepagents>=0.7,<0.8"]
dev = [
    "mypy>=1.13",
    "ruff==0.16.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "import-linter>=2.1",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "deepagents>=0.7,<0.8",
    # Test fixtures only — nothing under src/ imports it.
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readeverything"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Ships no stubs and no py.typed marker; confined to one adapter (see
# tests/unit/test_dependencies_stay_confined.py), so this is scoped there
# rather than globally.
module = "faster_whisper"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: real components wired together; no network, no model server",
    "live: requires a running model server",
    "accuracy: quality benchmark, not a pass/fail test",
    "slow: takes more than a second",
]
addopts = "-m 'not live and not accuracy'"

[tool.importlinter]
root_packages = ["readeverything"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
containers = ["readeverything"]
exhaustive = true
layers = [
    "composition",
    "testing",
    "agent",
    "pipeline",
    "registry",
    "handlers",
    "adapters",
    "ports",
    "domain",
]

[[tool.importlinter.contracts]]
name = "The testing toolkit sees only ports and domain"
type = "forbidden"
source_modules = ["readeverything.testing"]
forbidden_modules = [
    "readeverything.agent",
    "readeverything.pipeline",
    "readeverything.registry",
    "readeverything.handlers",
    "readeverything.adapters",
]

[tool.coverage.run]
source = ["src/readeverything"]
branch = true

[tool.coverage.report]
fail_under = 92
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]

# B101 (`assert_used`) is silenced for `readeverything/testing/` and nowhere
# else. That package is the port compliance suites, which live under `src/` so
# they can ship to handler authors outside this repository. They are test
# bodies: `assert` is what they are made of, and B101 exists to catch an
# `assert` load-bearing in *production* code, where `python -O` deletes it.
#
# A path skip, not `exclude_dirs`, and the difference is the whole point:
# excluding the directory would drop it from every bandit check, so a real
# vulnerability there would go unseen. This silences one rule, in one place.
[tool.bandit.assert_used]
skips = ["*/readeverything/testing/*.py"]
